<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Household Assistant</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1b1b19; --muted:#6b6b66; --rule:#e4e4e0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#15151a; --fg:#eceae6; --muted:#9b9a95; --rule:#2c2c33; }
  }
  :root[data-theme="dark"] { --bg:#15151a; --fg:#eceae6; --muted:#9b9a95; --rule:#2c2c33; }
  body { background:var(--bg); color:var(--fg); margin:0;
         font:16px/1.65 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:38rem; margin:0 auto; padding:4rem 16px; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 1rem; }
  hr { border:0; border-top:1px solid var(--rule); margin:2rem 0; }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Personal Household Assistant</h1>
  <p>
    A private, non-commercial application used by one household to organise its own
    email, calendar and documents. It is not offered to the public and has no users
    other than the household that runs it.
  </p>
  <hr>
  <p><a href="./privacy.html">Privacy policy</a> &middot; <a href="./terms.html">Terms of service</a></p>
</main>
</body>
</html>
